<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Linking Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f9fafb;min-height:100vh}
.mx{max-width:42rem;margin:0 auto;padding:2rem}
h1{font-size:1.5rem;font-weight:700;color:#111;margin-bottom:.25rem}
.st{font-size:.875rem;color:#666;margin-bottom:2rem}
.card{background:#fff;border-radius:.5rem;border:1px solid #e5e7eb;padding:2rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
label{display:block;font-size:.875rem;font-weight:500;color:#374151;margin-bottom:.5rem}
input,select{width:100%;padding:.625rem .75rem;border:1px solid #d1d5db;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem}
input:focus,select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
button{padding:.625rem 1.5rem;background:#2563eb;color:#fff;border:none;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer}
button:hover{background:#1d4ed8} button:disabled{opacity:.5;cursor:not-allowed}
.err{background:#fee2e2;color:#991b1b;padding:.75rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem;display:none}
.prog{height:.5rem;background:#e5e7eb;border-radius:9999px;overflow:hidden;margin:1rem 0;display:none}
.prog-bar{height:100%;background:#2563eb;border-radius:9999px;transition:width .5s}
.prog-txt{text-align:center;font-size:.8125rem;color:#666;margin-bottom:1rem;display:none}
.res{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.stat{background:#fff;border-radius:.5rem;border:1px solid #e5e7eb;padding:1rem;text-align:center}
.sl{font-size:.625rem;text-transform:uppercase;color:#666}
.sv{font-size:1.5rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.8125rem;background:#fff;border-radius:.5rem;border:1px solid #e5e7eb}
th{background:#f9fafb;text-align:left;padding:.625rem .75rem;font-weight:500;color:#374151;border-bottom:2px solid #e5e7eb}
td{padding:.625rem .75rem;border-bottom:1px solid #f3f4f6}
.badge{padding:.125rem .5rem;border-radius:9999px;font-size:.6875rem;font-weight:700}
.b-hi{background:#dcfce7;color:#166534}.b-md{background:#ffedd5;color:#9a3412}.b-lo{background:#fee2e2;color:#991b1b}
tr:hover{background:#f9fafb;cursor:pointer}
.ex{display:none;background:#f9fafb}
.ex td{padding:0 1.5rem .75rem}
.chip{display:inline-block;padding:.25rem .5rem;border-radius:.25rem;font-size:.6875rem;margin:.125rem}
.cp{background:#dbeafe;color:#1e40af}.cs{background:#f3f4f6;color:#374151}
.spin{display:inline-block;width:1rem;height:1rem;border:2px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:s .6s linear infinite;vertical-align:middle;margin-right:.5rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="mx">

<h1>Internal Linking Tool</h1>
<p class="st">Find unlinked keyword mentions across your site</p>

<div class="card">
  <label for="tu">Target URL</label>
  <input type="url" id="tu" placeholder="https://aioutlooks.com/blog/some-page/">
  <label for="cs">Screaming Frog Crawl</label>
  <select id="cs"><option value="">Loading...</option></select>
  <div style="display:flex;gap:.5rem;align-items:center">
    <button id="ab" onclick="go()" disabled>Analyze</button>
    <span id="sp" style="display:none"><span class="spin"></span> Working...</span>
  </div>
</div>

<div id="er" class="err"></div>
<div id="pb" class="prog"><div class="prog-bar" style="width:0%"></div></div>
<div id="pt" class="prog-txt"></div>

<div id="rd" class="res">
  <div class="stats">
    <div class="stat"><div class="sl">Pages w/ Opps</div><div class="sv" id="spg" style="color:#166534">0</div></div>
    <div class="stat"><div class="sl">Anchor Matches</div><div class="sv" id="sop" style="color:#9a3412">0</div></div>
    <div class="stat"><div class="sl">Scanned</div><div class="sv" id="ssc" style="color:#1d4ed8">0</div></div>
    <div class="stat"><div class="sl">Keywords</div><div class="sv" id="skw" style="color:#991b1b">0</div></div>
  </div>
  <div id="target-info" style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:.5rem;padding:.75rem;margin-bottom:1rem;font-size:.8125rem;display:none">
    <strong>Target:</strong> <span id="ti-title"></span>
    <span style="color:#9ca3af;margin:0 .5rem">|</span>
    <strong>Keywords:</strong> <span id="ti-kw"></span>
    <span style="color:#9ca3af;margin:0 .5rem">|</span>
    <strong>GSC:</strong> <span id="ti-gsc"></span>
    <span style="color:#9ca3af;margin:0 .5rem">|</span>
    <strong>Method:</strong> <span id="ti-method"></span>
  </div>
  <table><thead><tr><th>Page to Link From</th><th style="width:70px;text-align:center" title="Link Authority: Screaming Frog importance score (0-100). 0 = score not available.">Auth ⓘ</th><th style="width:70px;text-align:center">Clicks</th><th style="width:50px;text-align:center">#</th><th>Best Anchor</th></tr></thead>
  <tbody id="tb"></tbody></table>
</div>

</div>

<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
var aid=null,es=null;
fetch('/api/crawls').then(function(r){return r.json()}).then(function(c){
  var s=document.getElementById('cs');s.innerHTML='';
  c.forEach(function(x){s.innerHTML+='<option value="'+x.id+'">'+x.name+' ('+x.url_count+' URLs, '+x.date+')</option>'});
  if(c.length)s.value=c[0].id;
  document.getElementById('ab').disabled=false;
}).catch(function(e){document.getElementById('cs').innerHTML='<option value="">Error loading. Is Screaming Frog closed?</option>';showerr(e.message)});

function go(){
  var u=document.getElementById('tu').value,c=document.getElementById('cs').value;
  if(!u||!c)return;
  document.getElementById('sp').style.display='inline';document.getElementById('ab').disabled=true;
  document.getElementById('er').style.display='none';document.getElementById('rd').style.display='none';
  document.getElementById('pb').style.display='block';document.getElementById('pt').style.display='block';
  fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_url:u,crawl_id:c})})
  .then(function(r){return r.json()}).then(function(d){
    aid=d.analysis_id;es=new EventSource('/api/analyze/'+aid+'/stream');
    es.addEventListener('progress',function(e){var p=JSON.parse(e.data);document.querySelector('.prog-bar').style.width=p.percent+'%';document.getElementById('pt').textContent=p.detail||(p.percent+'%');if(p.phase==='complete')lr();});
    es.addEventListener('error',function(e){showerr(JSON.parse(e.data).detail||'Failed')});
    es.onerror=function(){setTimeout(lr,2000)};
  }).catch(function(e){showerr(e.message)});
}
function lr(){
  fetch('/api/analyze/'+aid+'/results').then(function(r){return r.json()}).then(function(d){
    if(d.error){showerr(d.error);return}
    var o=d.opportunities||[],m=d.meta||{};
    document.getElementById('pb').style.display='none';document.getElementById('pt').style.display='none';
    document.getElementById('sp').style.display='none';document.getElementById('rd').style.display='block';
    document.getElementById('spg').textContent=m.total_opportunities||0;
    document.getElementById('sop').textContent=m.total_anchor_options||0;
    document.getElementById('ssc').textContent=m.pages_scanned||0;
    document.getElementById('skw').textContent=m.gsc_keywords||0;
    var info=document.getElementById('target-info');
    if(m.target_title||m.target_h1){
      info.style.display='block';
      var hasLLM=o.length>0&&(o[0].matches||[]).some(function(x){return x.generation_method==='llm'});
      document.getElementById('ti-title').textContent=(m.target_title||m.target_h1||'Unknown').substring(0,80);
      document.getElementById('ti-kw').textContent=(m.keywords_list||[]).slice(0,6).join(', ')+((m.keywords_list||[]).length>6?' +'+(m.keywords_list.length-6)+' more':'');
      document.getElementById('ti-gsc').textContent=m.gsc_connected?'\u2713 Connected':'✗ Not connected';
      if((m.avg_link_authority||0)===0)document.getElementById('ti-gsc').insertAdjacentHTML('afterend','<br><span style=\"color:#9a3412;font-size:.75rem\">⚠ Link Authority is 0 for all pages — check Screaming Frog crawl config</span>');
      document.getElementById('ti-method').textContent=hasLLM?'LLM (DeepSeek)':'Heuristic';
    }
    var tb=document.getElementById('tb');tb.innerHTML='';
    o.forEach(function(x){
      var ac=x.link_authority>=80?'b-hi':x.link_authority>=50?'b-md':'b-lo';
      var su=x.source_url.split('/').slice(-2).join('/')||x.source_url;
      tb.innerHTML+='<tr onclick="tog(\''+escapeHtml(x.source_url.replace(/[^a-zA-Z0-9]/g,'_'))+'\')">'+
        '<td><a href="'+escapeHtml(x.source_url)+'" target="_blank" style="color:#2563eb;text-decoration:none" onclick="event.stopPropagation()">'+escapeHtml(su)+' ↗</a></td>'+
        '<td style="text-align:center"><span class="badge '+ac+'">'+(x.link_authority||0)+'</span></td>'+
        '<td style="text-align:center">'+(x.organic_clicks_90d||0)+'</td>'+
        '<td style="text-align:center"><span style="background:#dbeafe;color:#1e40af;padding:2px 6px;border-radius:9999px;font-size:.6875rem;font-weight:700">'+(x.match_count||0)+'</span></td>'+
        '<td style="color:#2563eb">'+escapeHtml(x.best_anchor||'')+'</td></tr>';
      var ac2=(x.matches||[]).map(function(m){
        var gm=m.generation_method==='llm'?' <span style="font-size:.5rem;background:#fbbf24;color:#78350f;padding:0 2px;border-radius:2px">LLM</span>':'';
        var vars=(m.variations||[]).map(function(v){return '<span class="chip cs">'+v+'</span>'}).join('');
        var at=(m.anchor_text||m.keyword).replace(/'/g,"\\'");
        return '<div style="margin-bottom:.25rem;display:flex;align-items:center;gap:.25rem">'+
          '<span class="chip '+(m.impression_share>=0.3?'cp':'cs')+'">'+escapeHtml(m.anchor_text||m.keyword)+' ('+Math.round((m.impression_share||0)*100)+'%)</span>'+gm+vars+
          '<button onclick="event.stopPropagation();var t=this;navigator.clipboard.writeText(\''+at+'\');t.textContent=\'\u2713\';setTimeout(function(){t.textContent=\'Copy\'},1000)" style="font-size:.625rem;padding:1px 4px;background:#e5e7eb;border:1px solid #d1d5db;border-radius:3px;cursor:pointer">Copy</button>'+
        '</div>';
      }).join('');
      tb.innerHTML+='<tr class="ex" id="ex-'+x.source_url.replace(/[^a-zA-Z0-9]/g,'_')+'"><td colspan="5">'+ac2+'<div style="font-size:.6875rem;color:#9ca3af;margin-top:.25rem;font-style:italic">'+escapeHtml(((x.matches||[])[0]||{}).context||'')+'</div></td></tr>';
    });
  }).catch(function(e){showerr(e.message)});
}
function tog(id){var r=document.getElementById('ex-'+id);if(r)r.style.display=r.style.display==='table-row'?'none':'table-row'}
function showerr(m){document.getElementById('sp').style.display='none';document.getElementById('pb').style.display='none';document.getElementById('pt').style.display='none';document.getElementById('ab').disabled=false;document.getElementById('er').textContent=m;document.getElementById('er').style.display='block';if(es)es.close()}
</script>
</body>
</html>
